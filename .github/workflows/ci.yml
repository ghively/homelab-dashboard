name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The prompt library and the renderer library must declare identical props
      # in identical order — OpenUI maps generated positional args by declaration
      # order, so drift makes panels render blank with no error anywhere. This
      # runs before the build because it is fast and the failure is specific.
      - run: npm run check:parity
      # next.config.ts no longer sets ignoreBuildErrors, so this type-checks
      # for real. A type error fails the build.
      - run: npm run build
      # The 30k system-prompt budget is a hard gate; adding components can blow it.
      - run: npx tsx scripts/measure-prompt.ts

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The error backlog is cleared, so lint now FAILS the build. 68 warnings
      # remain (mostly unused vars in legacy adapters); they are not gating yet.
      # Do not reintroduce `|| true` to make a red build green — fix the error.
      - run: npm run lint
